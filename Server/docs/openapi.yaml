openapi: "3.0.3"
info:
  title: Mallakhamb Competition API
  version: "1.0.0"
  description: |-
    Competition management for Mallakhamb India: registration, squad entry,
    payment, panel seating, live judging and results.
    
    ### Versioning
    Every path is served at BOTH `/api/v1/...` and `/api/...`. The unversioned
    form is an alias kept for the deployed client and should be retired one
    release after clients move over. Only the unversioned form is listed here;
    prefix it with `/v1` for the versioned equivalent.
    
    ### Authentication
    Login sets httpOnly `access_token` and `refresh_token` cookies AND returns
    the access token in the body. Browser clients should rely on the cookies.
    Non-browser clients send `Authorization: Bearer <token>`.
    
    ### CSRF
    Cookie-authenticated state-changing requests must carry `X-CSRF-Token`,
    fetched from `GET /api/csrf-token`. Requests carrying an `Authorization:
    Bearer` header are exempt, because a cross-site attacker cannot set headers.
    
    ### Competition context
    Most admin, coach and judge routes act inside ONE competition. The id is
    resolved from the access token first (set it with `POST
    /api/auth/set-competition`), then the `X-Competition-Id` header, then
    `competitionId` in the body or query. Routes that require it are marked, and
    return `COMPETITION_CONTEXT_REQUIRED` when none is found.
    
    ### Errors
    Failures are `{ success: false, error: { message, code, details? } }`.
    `details` maps a field name to its message on a validation failure.
  contact:
    name: Mallakhamb India
servers:
  - url: http://localhost:5000
    description: Unversioned alias — /api/...
  - url: http://localhost:5000/v1
    description: Versioned — /api/v1/... (prepend to the paths below)
tags:
  - name: Health
    description: Probes and metrics
  - name: Auth
    description: Sessions, CSRF, password reset, competition context
  - name: Players
    description: Athlete registration and self-service
  - name: Coaches
    description: Squad building, entry and payment
  - name: Teams
    description: Team CRUD
  - name: Competitions
    description: Competition CRUD and entries
  - name: Admin
    description: Competition administration
  - name: Judges
    description: Panel seating
  - name: Judge
    description: The judge-facing scoring client
  - name: Scores
    description: Score sheets and judge slips
  - name: Rankings
    description: Computed standings
  - name: Running order
    description: Lot draw and sequencing
  - name: Payments
    description: Razorpay orders, reconciliation and reporting
  - name: Public
    description: Anonymous endpoints for the public site
  - name: Super admin
    description: Platform-wide administration
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Also exempts the request from CSRF checking.
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Set by any login endpoint. Requires `X-CSRF-Token` on writes.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: Competition context is required.
            code:
              type: string
              example: VALIDATION_ERROR
              description: Stable machine-readable code — see src/errors/error-codes.js
            details:
              type: object
              additionalProperties:
                type: string
              description: Field name → message, for validation failures
    LoginResponse:
      type: object
      description: The access token is ALSO set as an httpOnly `access_token` cookie and a `refresh_token` cookie. Browser clients should rely on the cookies; the body copy exists for non-browser clients.
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
        userType:
          type: string
          enum:
            - player
            - coach
            - admin
            - superadmin
            - judge
    UserSummary:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        isActive:
          type: boolean
    Competition:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        name:
          type: string
          example: National Mallakhamb Championship
        year:
          type: integer
          example: 2026
        place:
          type: string
          example: Mumbai
        level:
          type: string
          enum:
            - District
            - State
            - National
            - International
        status:
          type: string
          enum:
            - upcoming
            - open
            - ongoing
            - completed
            - cancelled
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        competitionTypes:
          type: array
          items:
            type: string
            enum:
              - competition_1
              - competition_2
              - competition_3
              - Competition I
              - Competition II
              - Competition III
        ageGroups:
          type: array
          items:
            type: object
            properties:
              gender:
                type: string
                enum:
                  - Male
                  - Female
              ageGroup:
                type: string
                enum:
                  - Under10
                  - Under12
                  - Under14
                  - Under16
                  - Under18
                  - Above16
                  - Above18
              status:
                type: string
        registeredTeams:
          type: array
          description: Embedded entries. This array carries the whole squad of every entered team, which is why endpoints that populate it are the expensive ones.
          items:
            $ref: "#/components/schemas/RegisteredTeam"
    RegisteredTeam:
      type: object
      properties:
        team:
          type: string
          format: objectid
        coach:
          type: string
          format: objectid
        isSubmitted:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        paymentStatus:
          type: string
          enum:
            - pending
            - paid
            - failed
            - refunded
        players:
          type: array
          items:
            type: object
            properties:
              player:
                type: string
                format: objectid
              ageGroup:
                type: string
                enum:
                  - Under10
                  - Under12
                  - Under14
                  - Under16
                  - Under18
                  - Above16
                  - Above18
              gender:
                type: string
                enum:
                  - Male
                  - Female
              apparatus:
                type: object
                description: competitionType slug → apparatus[] the athlete is entered on
                additionalProperties:
                  type: array
                  items:
                    type: string
                    enum:
                      - Pole Mallakhamb
                      - Hanging Mallakhamb
                      - Rope Mallakhamb
    Team:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        name:
          type: string
          example: SGAM-A
        description:
          type: string
        coach:
          $ref: "#/components/schemas/UserSummary"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SubmittedTeam:
      type: object
      description: A team the coach has final-submitted AND paid for.
      properties:
        _id:
          type: string
          format: objectid
        name:
          type: string
        coach:
          $ref: "#/components/schemas/UserSummary"
        isSubmitted:
          type: boolean
        paymentStatus:
          type: string
        players:
          type: array
          items:
            type: object
            properties:
              player:
                $ref: "#/components/schemas/UserSummary"
              ageGroup:
                type: string
                enum:
                  - Under10
                  - Under12
                  - Under14
                  - Under16
                  - Under18
                  - Above16
                  - Above18
              gender:
                type: string
                enum:
                  - Male
                  - Female
              apparatus:
                type: object
                additionalProperties: true
              isFinalized:
                type: boolean
                description: Senior Judge has Final Submitted this athlete
              finalScore:
                type: number
                nullable: true
              hasScore:
                type: boolean
    Player:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - Male
            - Female
        ageGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
          nullable: true
        team:
          type: string
          format: objectid
          nullable: true
        stateUnit:
          type: string
          nullable: true
        registrationNumber:
          type: string
          nullable: true
    Judge:
      type: object
      description: A panel SEAT, not a login. The person filling it is `judgeAccount`; the same account routinely holds different seats in different categories.
      properties:
        _id:
          type: string
          format: objectid
        competition:
          type: string
          format: objectid
        gender:
          type: string
          enum:
            - Male
            - Female
        ageGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
        judgeNo:
          type: integer
          minimum: 1
          maximum: 6
        judgeType:
          type: string
          enum:
            - Senior Judge
            - Judge 1
            - Judge 2
            - Judge 3
            - Judge 4
            - Scorer
        competitionTypes:
          type: array
          items:
            type: string
            enum:
              - competition_1
              - competition_2
              - competition_3
              - Competition I
              - Competition II
              - Competition III
        apparatus:
          type: string
          enum:
            - Pole Mallakhamb
            - Hanging Mallakhamb
            - Rope Mallakhamb
          nullable: true
        judgeAccount:
          type: string
          format: objectid
          nullable: true
          description: null = empty slot
        isActive:
          type: boolean
    JudgeSlipBreakdown:
      type: object
      description: |-
        COP §3.3 section marks. Each section is capped and the total may not exceed 10.00.
        
        `difficulty` and `combination` are OBJECTS carrying a `total` plus the selections behind it — the element list and the checklist — so re-opening a slip restores the exact selections rather than only the section total. `execution` and `bonus` are plain numbers.
        
        Sending a bare number for `difficulty` or `combination` is not rejected: the server reads `.total` off it, gets `undefined`, and treats the section as 0. Send the object form.
      properties:
        difficulty:
          type: object
          properties:
            total:
              type: number
              minimum: 0
              maximum: 3.8
            elements:
              type: array
              description: The A/B/C elements performed, valued 0.20 / 0.40 / 0.60.
              items:
                type: object
                additionalProperties: true
        combination:
          type: object
          properties:
            total:
              type: number
              minimum: 0
              maximum: 1.6
            checklist:
              type: object
              description: The per-apparatus checklist; a failed item deducts its penalty.
              additionalProperties: true
        execution:
          type: number
          minimum: 0
          maximum: 4.4
        bonus:
          type: number
          enum:
            - 0
            - 0.2
          description: All-or-nothing. Also accepted as `originality`.
    PlayerScore:
      type: object
      properties:
        playerId:
          type: string
          format: objectid
        playerName:
          type: string
        playerGender:
          type: string
          enum:
            - Male
            - Female
        playerAgeGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
        apparatus:
          type: string
          enum:
            - Pole Mallakhamb
            - Hanging Mallakhamb
            - Rope Mallakhamb
        judgeScores:
          type: object
          description: "seat → mark, e.g. { seniorJudge: 8.6, judge1: 8.4, judge2: 8.5 }"
          additionalProperties:
            type: number
        judgeSlips:
          type: array
          items:
            type: object
            additionalProperties: true
        averageMarks:
          type: number
        executionAverage:
          type: number
        baseScore:
          type: number
        toleranceUsed:
          type: number
        deduction:
          type: number
          description: Time deduction recorded by the Scorer
        otherDeduction:
          type: number
        finalScore:
          type: number
        isFinalized:
          type: boolean
        finalizedAt:
          type: string
          format: date-time
    Score:
      type: object
      description: One document per (team, gender, ageGroup, competition, competitionType) — the unique index `score_identity_unique`.
      properties:
        _id:
          type: string
          format: objectid
        competition:
          type: string
          format: objectid
        teamId:
          type: string
          format: objectid
        gender:
          type: string
          enum:
            - Male
            - Female
        ageGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
        competitionType:
          type: string
          enum:
            - Competition I
            - Competition II
            - Competition III
        playerScores:
          type: array
          items:
            $ref: "#/components/schemas/PlayerScore"
        timeKeeper:
          type: string
        scorer:
          type: string
        remarks:
          type: string
        isLocked:
          type: boolean
    SaveScoreRequest:
      type: object
      description: |-
        Two shapes share this endpoint.
        
        **Single judge slip** — `playerId` + `score` (+ optional `breakdown`). The panel seat written is resolved from the caller's own assignment for THIS category; a `judgeType` in the body is ignored unless the caller is a Senior Judge overriding, or an admin recording on the panel's behalf.
        
        **Bulk sheet** — `playerScores[]`, used by the Scorer and admin screens.
      properties:
        competition:
          type: string
          format: objectid
        teamId:
          type: string
          format: objectid
        gender:
          type: string
          enum:
            - Male
            - Female
        ageGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
        competitionType:
          type: string
          enum:
            - competition_1
            - competition_2
            - competition_3
            - Competition I
            - Competition II
            - Competition III
        apparatus:
          type: string
          enum:
            - Pole Mallakhamb
            - Hanging Mallakhamb
            - Rope Mallakhamb
        playerId:
          type: string
          format: objectid
          description: Single-slip form
        playerName:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 10
          description: Single-slip form
        breakdown:
          $ref: "#/components/schemas/JudgeSlipBreakdown"
        judgeType:
          type: string
          enum:
            - Senior Judge
            - Judge 1
            - Judge 2
            - Judge 3
            - Judge 4
            - Scorer
          description: Honoured only for admins, or a Senior Judge with `overrideBySenior`
        overrideBySenior:
          type: boolean
        isFinalSubmit:
          type: boolean
          description: Senior Judge only — finalizes and locks this athlete's result
        panelSize:
          type: integer
          enum:
            - 3
            - 4
            - 5
        playerScores:
          type: array
          items:
            $ref: "#/components/schemas/PlayerScore"
          description: Bulk form
        timeKeeper:
          type: string
        scorer:
          type: string
        remarks:
          type: string
        isLocked:
          type: boolean
    RunningOrder:
      type: object
      properties:
        competition:
          type: string
          format: objectid
        gender:
          type: string
          enum:
            - Male
            - Female
        ageGroup:
          type: string
          enum:
            - Under10
            - Under12
            - Under14
            - Under16
            - Under18
            - Above16
            - Above18
        competitionType:
          type: string
        lotsDrawnAt:
          type: string
          format: date-time
          nullable: true
        hasOrder:
          type: boolean
        teams:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                format: objectid
              name:
                type: string
              coachName:
                type: string
              lotNo:
                type: integer
                nullable: true
              position:
                type: integer
                nullable: true
              playerCount:
                type: integer
              players:
                type: array
                items:
                  type: object
                  additionalProperties: true
    Transaction:
      type: object
      properties:
        _id:
          type: string
          format: objectid
        competition:
          type: string
          format: objectid
        team:
          type: string
          format: objectid
        coach:
          type: string
          format: objectid
        amount:
          type: number
        paymentStatus:
          type: string
          enum:
            - pending
            - paid
            - failed
            - refunded
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
        createdAt:
          type: string
          format: date-time
    Paginated:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
    DashboardStats:
      type: object
      properties:
        totalTeams:
          type: integer
        totalParticipants:
          type: integer
        boysTeams:
          type: integer
        girlsTeams:
          type: integer
        totalBoys:
          type: integer
        totalGirls:
          type: integer
        submittedTeams:
          type: integer
        totalJudges:
          type: integer
        competition:
          type: object
          properties:
            name:
              type: string
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            status:
              type: string
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Detailed health check
      operationId: health
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Component-by-component status. Touches the database, so it is not the probe to poll at high frequency — use `/api/health/live`.
        
        **Public** — no authentication required.
      security: []
  /api/health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      operationId: healthLive
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Process is up. No I/O — safe to poll aggressively.
        
        **Public** — no authentication required.
      security: []
  /api/health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      operationId: healthReady
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Ready to take traffic: checks the database connection.
        
        **Public** — no authentication required.
      security: []
  /api/health/metrics:
    get:
      tags:
        - Health
      summary: Performance metrics
      operationId: healthMetrics
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - prometheus
            default: json
          description: Output format
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Per-route request counts and latency percentiles collected by the metrics middleware.
        
        **Public** — no authentication required.
      security: []
  /api/health-legacy:
    get:
      tags:
        - Health
      summary: Legacy liveness string
      operationId: healthLegacy
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Kept for an old caller. Prefer `/api/health/live`.
        
        **Public** — no authentication required.
      deprecated: true
      security: []
  /api/csrf-token:
    get:
      tags:
        - Auth
      summary: Issue a CSRF token
      operationId: csrfToken
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      csrfToken:
                        type: string
                  message:
                    type: string
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: |-
        Sets the `csrf-token` cookie AND returns the token in the body. The SPA reads the BODY copy, because the client origin and the API are different sites and JS cannot read another origin's cookie. Send it back in `X-CSRF-Token` on every POST/PUT/PATCH/DELETE. Requests carrying `Authorization: Bearer` are exempt.
        
        **Public** — no authentication required.
      security: []
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: The authenticated principal
      operationId: authMe
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserSummary"
                  message:
                    type: string
        "401":
          description: Missing, invalid, expired or logged-out token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated, but the principal lacks the required role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Session rehydration on page load. Works with either the cookie or a Bearer token.
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      operationId: authLogout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data: {}
                  message:
                    type: string
        "401":
          description: Missing, invalid, expired or logged-out token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated, but the principal lacks the required role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: Clears both cookies and records the logout instant, which invalidates every access token issued before it.
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Exchange the refresh cookie for a new access token
      operationId: authRefresh
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LoginResponse"
                  message:
                    type: string
        "401":
          description: Refresh token missing, expired or revoked
          content:
            application/json:
              schema:
