<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: unsafe-inline/unsafe-eval required for React/Vite in development -->
    <!-- For production: Consider implementing nonce-based CSP -->
    <!--
      frame-ancestors is deliberately NOT in the policy below. Browsers ignore
      that directive when it arrives via <meta> and log an error for it on every
      single page load, which buried real console output. It only works as a
      response header, so it is set in two places instead:
        - render.yaml, for the deployed static site
        - vite.config.js `server.headers`, so dev matches production
    -->
    <!-- (X-Frame-Options: DENY is also set in render.yaml for older browsers.) -->
    <!--
      worker-src is set EXPLICITLY because it falls back to script-src when it
      is not, and script-src has no `blob:` — so anything spawning a worker from
      a blob URL is blocked with "Note that 'worker-src' was not explicitly set".
      Razorpay's checkout.js does exactly that, which put this on the payment
      page rather than anywhere obvious; it first surfaced as a console error in
      a seeding run. `blob:` here is the worker's own source, not a script
      origin, so it does not widen what may be loaded and executed as a script.
    -->
    <!--
      connect-src lists BOTH SPELLINGS OF LOOPBACK, and that is not redundancy.

      `localhost` and `127.0.0.1` are the same machine, but CSP matches the
      host STRING and not the address it resolves to — so a policy naming only
      one of them blocks the other. That bit whenever the API was addressed as
      127.0.0.1: every call failed as a bare axios "Network Error", with no
      request in the server log and nothing on screen pointing at a policy,
      because a CSP refusal never reaches the network at all.

      Both spellings are unavoidable together. Node's fetch resolves `localhost`
      to ::1 on Windows while the API listens on IPv4, so the seeding scripts
      have to say 127.0.0.1 — while the BROWSER has to be given a host this
      policy names. `vite.config.js` already allows the pair in `allowedHosts`
      for the same reason.

      No widening: an origin that can reach one loopback spelling can reach the
      other, and a page that may talk to its own machine at all may already do
      so via `localhost:*`. (`[::1]` is deliberately absent — CSP's host grammar
      has no place for an IPv6 literal, so browsers discard the source
      expression as invalid and log a warning on every page load.)
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com;
                   worker-src 'self' blob:;
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   font-src 'self' data:;
                   connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://*.onrender.com https://*.ngrok-free.app https://*.ngrok.io http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss://*.onrender.com wss://*.ngrok-free.app wss://*.ngrok.io;
                   frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com;
                   base-uri 'self';
                   form-action 'self' https://api.razorpay.com;">
    <meta name="csrf-token" content="">
    <!-- Additional security headers (also configure on server) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>MallakhambIndia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
