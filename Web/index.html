<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: unsafe-inline/unsafe-eval required for React/Vite in development -->
    <!-- For production: Consider implementing nonce-based CSP -->
    <!--
      frame-ancestors is deliberately NOT in the policy below. Browsers ignore
      that directive when it arrives via <meta> and log an error for it on every
      single page load, which buried real console output. It only works as a
      response header, so it is set in two places instead:
        - render.yaml, for the deployed static site
        - vite.config.js `server.headers`, so dev matches production
    -->
    <!-- (X-Frame-Options: DENY is also set in render.yaml for older browsers.) -->
    <!--
      worker-src is set EXPLICITLY because it falls back to script-src when it
      is not, and script-src has no `blob:` — so anything spawning a worker from
      a blob URL is blocked with "Note that 'worker-src' was not explicitly set".
      Razorpay's checkout.js does exactly that, which put this on the payment
      page rather than anywhere obvious; it first surfaced as a console error in
      a seeding run. `blob:` here is the worker's own source, not a script
      origin, so it does not widen what may be loaded and executed as a script.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com;
                   worker-src 'self' blob:;
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:; 
                   font-src 'self' data:; 
                   connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://*.onrender.com https://*.ngrok-free.app https://*.ngrok.io http://localhost:* ws://localhost:* wss://*.onrender.com wss://*.ngrok-free.app wss://*.ngrok.io;
                   frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com;
                   base-uri 'self';
                   form-action 'self' https://api.razorpay.com;">
    <meta name="csrf-token" content="">
    <!-- Additional security headers (also configure on server) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>MallakhambIndia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
