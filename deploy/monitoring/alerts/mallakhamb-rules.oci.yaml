            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                count(mallakhamb_mongo_up{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"} == 1) or
                vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 3
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-member-unhealthy
        title: MongoDB member not healthy
        condition: C
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'A replica-set member is not PRIMARY or SECONDARY (down, recovering or unreachable).'
          description: >-
            See which in mallakhamb_mongo_member_state (8 = down, 3 = recovering, 6 = unknown). On that VM: journalctl
            -u mongod -n 100. A member that fell off the oplog needs a resync (empty its dbPath and restart). Runbook:
            deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-database
          __panelId__: '1'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                count(max by (member)
                (mallakhamb_mongo_member_state{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"}) !=
                1 != 2) or vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-lag
