            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                sum(increase(mallakhamb_auth_logins_total{scrape_job="mallakhamb-api",outcome="failure"}[5m])) or
                vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 25
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-payment-webhook
        title: Payment webhook problem
        condition: C
        for: 0s
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: A Razorpay webhook was rejected or failed in the last 15 minutes.
          description: >-
            First look: Competition day → "Payment webhooks", and Razorpay dashboard → Webhooks. rejected_signature →
            RAZORPAY_WEBHOOK_SECRET mismatch; error → journalctl -u mallakhamb on the active. Runbook: PLAN.md §8
            "Payment webhook problem".
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-competition-day
          __panelId__: '13'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                sum(increase(mallakhamb_payment_webhooks_total{scrape_job="mallakhamb-api",outcome=~"rejected_signature|error"}[15m]))
                or vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-uptime-check
        title: Uptime check failing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: 'Outside-in check {{ $labels.job }} is failing from both Mumbai and Hyderabad.'
          description: >-
            This is what a tablet in India sees, including DNS, TLS and Caddy. api-ready → GET /api/health/ready (needs
            the database); web-home → the SPA. First look: API overview → "Outside-in" row, then on the active:
            systemctl status caddy mallakhamb. If /metrics still scrapes (API down is quiet), suspect DNS, the
            certificate (journalctl -u caddy) or the database. Runbook: PLAN.md §8 "Uptime check failing".
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-api-overview
          __panelId__: '24'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'count by (job) (probe_success{job=~"api-ready|web-home"} == 0)'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-host-missing
        title: Host metrics missing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: No host metrics from the active server for 10 minutes.
          description: >-
            Alloy on the active has stopped (systemctl status alloy; journalctl -u alloy), its Grafana token was
            revoked, or the VM is down; check "API down" too. Console → Instances: if it is STOPPED (Oracle idle
            reclaim) the Resource Scheduler starts it within 30 min; to serve sooner, or if the start fails (no A1
            capacity), fail over. deploy/oci/IDLE-RECLAIM-PLAN.md §3C. If the VM is gone: deploy/oci/PLAN.md O13.
            Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '14'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'absent(up{scrape_job="mallakhamb-host"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-host-memory
        title: Host memory high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The active server is using more than 85 % of its memory ({{ humanizePercentage $values.A.Value }}).'
          description: >-
            First look: Runtime → "Memory: % of plan" (is it the API?) and the Host row. Something besides the API (a
            stuck mongodump, a runaway script) shows as host memory without API RSS. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '15'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                1 - node_memory_MemAvailable_bytes{scrape_job="mallakhamb-host"} /
                node_memory_MemTotal_bytes{scrape_job="mallakhamb-host"}
              instant: true
              range: false
              intervalMs: 60000
