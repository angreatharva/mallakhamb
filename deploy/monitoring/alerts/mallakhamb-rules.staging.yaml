            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                max by (instance) (1 -
                node_filesystem_avail_bytes{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db",mountpoint="/"}
                /
                node_filesystem_size_bytes{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db",mountpoint="/"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
