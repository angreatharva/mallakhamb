# GENERATED from apply-alerts.js by export-yaml.js. Do not edit by hand.
# Group mallakhamb-oci-staging: the nightly e2e alerts for the OCI staging servers, LIVE now
# (pasted with PLATFORM='render'); deleted at the cutover, when the main group carries them.
apiVersion: 1
groups:
  - orgId: 1
    name: mallakhamb-oci-staging
    folder: Mallakhamb
    interval: 1m
    rules:
      - uid: mk-e2e-failed-stg
        title: E2E failed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The nightly full-season check failed on {{ $labels.instance }} (exit {{ $values.A.Value }}).'
          description: >-
            A real flow broke on that release (registration, squads, payment, panels, scoring or publishing), or the e2e
            database/Atlas user is wrong. First look, on that VM: journalctl -u mallakhamb-e2e -n 200 (the step report
            is at the end), then /var/log/mallakhamb-e2e. Fix before the next meet. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'max by (instance) (mallakhamb_e2e_last_exit_code{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-e2e-stale-stg
        title: E2E stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The nightly e2e timer has not fired on {{ $labels.instance }} for more than 26 hours.'
          description: >-
            Meet days still count as a run (skipped), so this means the timer itself stopped: systemctl status
            mallakhamb-e2e.timer mallakhamb-e2e; a run longer than 2 h is killed (TimeoutStartSec). Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                time() - max by (instance)
                (mallakhamb_e2e_last_run_timestamp_seconds{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 93600
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-no-primary-stg
        title: MongoDB has no primary
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: 'No replica-set member sees a PRIMARY: nothing can be written.'
          description: >-
            Two of three members are down or cut off from each other. On each VM over the Bastion: systemctl status
            mongod; journalctl -u mongod -n 100. Bring a second member back and the set elects a primary by itself. Only
            if two members are gone for good: forced reconfig to the survivor (owner decision; it can undo unreplicated
            writes). Runbook: deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                max(mallakhamb_mongo_primary_present{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-members-missing-stg
        title: MongoDB members not all answering
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'Only {{ $values.A.Value }} of the 3 replica-set members answer their health check.'
          description: >-
            One member's mongod, VM or collector is down. Writes continue while two of three are up, but the next loss
            stops them. On the missing VM: systemctl status mongod mallakhamb-mongo-metrics.timer alloy. Runbook:
            deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                count(mallakhamb_mongo_up{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"} == 1) or
                vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 3
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-member-unhealthy-stg
        title: MongoDB member not healthy
        condition: C
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'A replica-set member is not PRIMARY or SECONDARY (down, recovering or unreachable).'
          description: >-
            See which in mallakhamb_mongo_member_state (8 = down, 3 = recovering, 6 = unknown). On that VM: journalctl
            -u mongod -n 100. A member that fell off the oplog needs a resync (empty its dbPath and restart). Runbook:
            deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                count(max by (member)
                (mallakhamb_mongo_member_state{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"}) !=
                1 != 2) or vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-lag-stg
        title: MongoDB replication lag
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'A member is {{ humanizeDuration $values.A.Value }} behind the primary.'
          description: >-
            Usually db-03 (the 1/8-OCPU micro) under heavy writes, or a slow disk. Harmless while app-01 and app-02 both
            run; with one of them down it slows every majority write. Runbook: deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2
            (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                max(mallakhamb_mongo_replication_lag_seconds{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 30
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-oplog-window-stg
        title: MongoDB oplog window short
        condition: C
        for: 30m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: The oplog holds less than 48 h of history.
          description: >-
            A member down longer than the window must be resynced, and point-in-time restore depends on the slices
            keeping up. Raise replication.oplogSizeMB in install-mongo.sh (rolling restart) or find what writes so much.
            Runbook: deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                min(mallakhamb_mongo_oplog_window_seconds{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 172800
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-connections-stg
        title: MongoDB connections high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: '{{ $values.A.Value }} open connections on one member.'
          description: >-
            The API pool is up to 100 per process; more means a leak, a reconnect storm, or several API processes.
            Runbook: deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                max(mallakhamb_mongo_connections_current{scrape_job=~"mallakhamb-host|mallakhamb-host-standby|mallakhamb-db"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-rollback-stg
        title: MongoDB rollback files
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: A failover undid writes that had not reached a majority (files in mongod rollback/).
          description: >-
            The app writes with w:"majority", so these should never be acknowledged writes. Look at
