# GENERATED from apply-alerts.js by export-yaml.js. Do not edit by hand.
# Group mallakhamb-oci-staging: the nightly e2e alerts for the OCI staging servers, LIVE now
# (pasted with PLATFORM='render'); deleted at the cutover, when the main group carries them.
apiVersion: 1
groups:
  - orgId: 1
    name: mallakhamb-oci-staging
    folder: Mallakhamb
    interval: 1m
    rules:
      - uid: mk-host-missing-stg
        title: Host metrics missing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: No host metrics from the active server for 10 minutes.
          description: >-
            Alloy on the active has stopped (systemctl status alloy; journalctl -u alloy), its Grafana token was
            revoked, or the VM is down; check "API down" too. Console → Instances: if it is STOPPED (Oracle idle
            reclaim) the Resource Scheduler starts it within 30 min; to serve sooner, or if the start fails (no A1
            capacity), fail over. deploy/oci/IDLE-RECLAIM-PLAN.md §3C. If the VM is gone: deploy/oci/PLAN.md O13.
            Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'absent(up{scrape_job="mallakhamb-host"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-e2e-failed-stg
        title: E2E failed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The full-season e2e check failed on {{ $labels.instance }} (exit {{ $values.A.Value }}).'
          description: >-
            A real flow broke on that release (registration, squads, payment, panels, scoring or publishing), or the e2e
            database/Atlas user is wrong. First look, on that VM: journalctl -u mallakhamb-e2e -n 200 (the step report
            is at the end), then /var/log/mallakhamb-e2e. Fix before the next meet. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'max by (instance) (mallakhamb_e2e_last_exit_code{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-e2e-stale-stg
        title: E2E stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The e2e check has not run on {{ $labels.instance }} for more than 20 hours.'
          description: >-
            Each VM runs two of the four daily slots (its role decides which), and a skip — a meet today or tomorrow, a
            busy API, a desk in use, NO_E2E — still counts as a run. So this means the timer stopped, or the VM kept the
            wrong role for a day: systemctl status mallakhamb-e2e.timer mallakhamb-e2e; a run longer than 1 h is killed
            (TimeoutStartSec). Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                time() - max by (instance)
                (mallakhamb_e2e_last_run_timestamp_seconds{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 72000
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-standby-missing-stg
