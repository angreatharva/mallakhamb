        isPaused: false
      - uid: mk-pitr-base-stale-stg
        title: Point-in-time base stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: No point-in-time base dump for more than 26 hours.
          description: >-
            The first slice of each UTC day takes the base; see journalctl -u mallakhamb-oplog-slice. Runbook:
            deploy/oci/MONGODB-SELF-HOSTED-PLAN.md §2 (failure matrix).
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
        data:
          - refId: A
            relativeTimeRange:
