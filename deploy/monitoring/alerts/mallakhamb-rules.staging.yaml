        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: A failover undid writes that had not reached a majority (files in mongod rollback/).
          description: >-
            The app writes with w:"majority", so these should never be acknowledged writes. Look at
