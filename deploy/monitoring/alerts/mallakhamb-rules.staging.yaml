                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-mongo-disk-stg
        title: MongoDB member disk filling
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The root disk of {{ $labels.instance }} is more than 80 % full ({{ humanizePercentage $values.A.Value }}).'
          description: >-
