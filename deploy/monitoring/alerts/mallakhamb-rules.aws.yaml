            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                sum(increase(mallakhamb_payment_webhooks_total{scrape_job="mallakhamb-api",outcome=~"rejected_signature|error"}[15m]))
                or vector(0)
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-uptime-check
        title: Uptime check failing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: 'Outside-in check {{ $labels.job }} is failing from both Mumbai and Hyderabad.'
          description: >-
            This is what a tablet in India sees, including DNS, TLS and Caddy. api-ready → GET /api/health/ready (needs
            the database); web-home → the SPA. First look: API overview → "Outside-in" row, then on the active:
            systemctl status caddy mallakhamb. If /metrics still scrapes (API down is quiet), suspect DNS, the
            certificate (journalctl -u caddy) or the database. Runbook: PLAN.md §8 "Uptime check failing".
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-api-overview
          __panelId__: '24'
        data:
