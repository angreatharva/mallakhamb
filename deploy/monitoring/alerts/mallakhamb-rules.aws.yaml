              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'absent(up{scrape_job="mallakhamb-host"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-host-memory
        title: Host memory high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The active server is using more than 85 % of its memory ({{ humanizePercentage $values.A.Value }}).'
          description: >-
            First look: Runtime → "Memory: % of plan" (is it the API?) and the Host row. Something besides the API (a
            stuck mongodump, a runaway script) shows as host memory without API RSS. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '15'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                1 - node_memory_MemAvailable_bytes{scrape_job="mallakhamb-host"} /
                node_memory_MemTotal_bytes{scrape_job="mallakhamb-host"}
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.85
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-disk-filling
        title: Disk filling
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The active server''s root disk is more than 80 % full ({{ humanizePercentage $values.A.Value }}).'
          description: >-
            First look: sudo du -xh / --max-depth=2 | sort -h | tail; journalctl --disk-usage; /var/log/mallakhamb;
            /opt/mallakhamb/releases (the deploy keeps the live one + 4). Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '16'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                1 - node_filesystem_avail_bytes{scrape_job="mallakhamb-host",mountpoint="/"} /
                node_filesystem_size_bytes{scrape_job="mallakhamb-host",mountpoint="/"}
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.8
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-disk-critical
        title: Disk almost full
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: 'The active server''s root disk is more than 90 % full ({{ humanizePercentage $values.A.Value }}).'
          description: >-
            At 100 % MongoDB tools, logging and deploys fail. Free space now (see "Disk filling"); sudo journalctl
            --vacuum-time=7d is safe. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '16'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                1 - node_filesystem_avail_bytes{scrape_job="mallakhamb-host",mountpoint="/"} /
                node_filesystem_size_bytes{scrape_job="mallakhamb-host",mountpoint="/"}
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.9
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-backup-stale
        title: Backup stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: The last successful backup on the active is more than 26 hours old.
          description: >-
            First look: systemctl status mallakhamb-backup.timer mallakhamb-backup; journalctl -u mallakhamb-backup -n
            100. Usually Atlas unreachable or the bucket upload refused. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '13'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'time() - mallakhamb_backup_last_success_timestamp_seconds{scrape_job="mallakhamb-host"}'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 93600
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-oom-kill
        title: Out-of-memory kill
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          service: mallakhamb-api
          severity: critical
        annotations:
          summary: The kernel killed a process for memory on the active server.
          description: >-
            If it was the API, every tablet lost its connection (systemd restarted it). First look: sudo journalctl -k |
            grep -i oom, then Runtime → RSS and the Host row. Runbook: PLAN.md §8 "Memory near limit / Restart loop".
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '20'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'sum by (instance) (increase(node_vmstat_oom_kill{scrape_job="mallakhamb-host"}[15m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-inodes
        title: Inodes running out
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: Less than 10 % of inodes are free on the active server's root disk.
          description: >-
            Millions of small files, usually a temp or session directory. First look: sudo du -x --inodes /
            --max-depth=3 | sort -n | tail. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '17'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                node_filesystem_files_free{scrape_job="mallakhamb-host",mountpoint="/"} /
                node_filesystem_files{scrape_job="mallakhamb-host",mountpoint="/"}
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.1
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-e2e-failed
        title: E2E failed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The nightly full-season check failed on {{ $labels.instance }} (exit {{ $values.A.Value }}).'
          description: >-
            A real flow broke on that release (registration, squads, payment, panels, scoring or publishing), or the e2e
            database/Atlas user is wrong. First look, on that VM: journalctl -u mallakhamb-e2e -n 200 (the step report
            is at the end), then /var/log/mallakhamb-e2e. Fix before the next meet. Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '22'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: 'max by (instance) (mallakhamb_e2e_last_exit_code{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
      - uid: mk-e2e-stale
        title: E2E stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          service: mallakhamb-api
          severity: warning
        annotations:
          summary: 'The nightly e2e timer has not fired on {{ $labels.instance }} for more than 26 hours.'
          description: >-
            Meet days still count as a run (skipped), so this means the timer itself stopped: systemctl status
            mallakhamb-e2e.timer mallakhamb-e2e; a run longer than 2 h is killed (TimeoutStartSec). Runbook: PLAN.md §8.
          runbook_url: >-
            https://github.com/angreatharva/mallakhamb/blob/master/deploy/monitoring/PLAN.md#8-runbook--when-an-alert-fires
          __dashboardUid__: mallakhamb-runtime
          __panelId__: '21'
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                time() - max by (instance)
                (mallakhamb_e2e_last_run_timestamp_seconds{scrape_job=~"mallakhamb-host|mallakhamb-host-standby"})
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: grafanacloud-prom
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 93600
              datasource:
                type: __expr__
                uid: __expr__
        isPaused: false
